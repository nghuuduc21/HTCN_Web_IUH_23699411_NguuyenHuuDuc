<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Feane</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Navbar */
    .navbar {
      background-color: #000 !important;
    }

    .navbar .nav-link,
    .navbar-brand {
      color: #fff !important;
    }

    .navbar .nav-link:hover,
    .navbar .nav-link.active {
      color: #ffc107 !important;
    }

    /* Fullscreen about section */
    .about-section {
      height: 100vh; /* full màn hình */
      background: url('../image/main_picture.png') no-repeat center center/cover;
      position: relative;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Overlay tối nhẹ để nổi chữ */
    .about-section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .about-content {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }

    .about-content h1 {
      font-size: 3rem;
      font-weight: 700;
    }

    .about-content p {
      font-size: 1.2rem;
      margin: 1.5rem 0;
    }

    .btn-warning {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fs-3 fw-bold text-white" href="home.html">TYDY STUDIO</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a href="home.html" class="nav-link">HOME</a></li>
          <li class="nav-item"><a href="menu.html" class="nav-link">MENU</a></li>
          <li class="nav-item"><a href="about.html" class="nav-link ">ABOUT</a></li>
          <li class="nav-item"><a href="book.html" class="nav-link">BOOK SHOW</a></li>
        </ul>
      </div>
      <a href="order.html" class="btn btn-warning text-dark">Contact Online</a>
    </div>
  </nav>

  <!-- About Section -->
  <section class="about-section">
    <div class="about-content">
      <h1>We Are TYDY STUDIO</h1>
      <p>
        Chúng tôi là một studio có nhiều kinh nghiệm trong lĩnh vực Media. Với sự chỉ đạo của CEO & Founder Trần Đức Lôc.
      </p>
      <a href="../HTML/about.html" class="btn btn-warning">Read More</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
