 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book A Show</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
    }

    /* Navbar */
    .navbar {
      background: linear-gradient(to right, #000, #333);
    }
    .navbar .nav-link {
      color: #fff;
      margin: 0 10px;
      font-weight: 500;
    }
    .navbar .nav-link:hover,
    .navbar .nav-link.active {
      color: #ffc107;
    }

    /* Title */
    .book-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      margin-top: 50px;
      margin-bottom: 30px;
      color: #333;
    }

    /* Form */
    .form-control, .form-select {
      border-radius: 8px;
      box-shadow: none;
    }

    .btn-warning {
      font-weight: 600;
      border-radius: 8px;
    }

    iframe {
      border: 0;
      width: 100%;
      height: 400px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand fs-3 fw-bold text-white" href="home.html">TYDY STUDIO</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a href="home.html" class="nav-link">HOME</a></li>
          <li class="nav-item"><a href="menu.html" class="nav-link">MENU</a></li>
          <li class="nav-item"><a href="about.html" class="nav-link">ABOUT</a></li>
          <li class="nav-item"><a href="book.html" class="nav-link active">BOOK SHOW</a></li>
        </ul>
      </div>
      <a href="order.html" class="btn btn-warning text-dark">Order Online</a>
    </div>
  </nav>

  <!-- Booking Section -->
  <section class="container py-5">
    <h2 class="text-center book-title">Book A Show</h2>

    <div class="row justify-content-center align-items-start">
      <!-- Form -->
      <div class="col-md-6">
        <form>
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Your Name" required>
          </div>
          <div class="mb-3">
            <input type="tel" class="form-control" placeholder="Phone Number" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" placeholder="Your Email" required>
          </div>
          <div class="mb-3">
            <select class="form-select" required>
              <option selected disabled>How many people?</option>
              <option>1 person</option>
              <option>2 people</option>
              <option>3-5 people</option>
              <option>6-10 people</option>
              <option>More than 10</option>
            </select>
          </div>
          <div class="mb-3">
            <input type="date" class="form-control" required>
          </div>
          <div class="mb-3">
            <textarea class="form-control" rows="3" placeholder="Any special request (optional)"></textarea>
          </div>
          <button class="btn btn-warning w-100">BOOK NOW</button>
        </form>
      </div>

      <!-- Map -->
      <div class="col-md-6 mt-4 mt-md-0">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3918.4937954721813!2d106.66220227465655!3d10.849997089303297!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3175290001f9209f%3A0x8e682d4305b85aac!2sTyDy%20Studio!5e0!3m2!1svi!2s!4v1761373713284!5m2!1svi!2s" 
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
