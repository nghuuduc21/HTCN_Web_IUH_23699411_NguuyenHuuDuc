<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./lesson2.css">
    <title>FlowerBox 360</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="container_logo">
                <div><img id="logo2" src="./img/logo2.jpg" alt="logo2"></div>
                <div class="describe_logo">
                    <figcaption id="fig1"><strong>FlowerBox 360</strong></figcaption>
                    <figcaption id="fig2">...to get your daily dose of luxury roses!</figcaption>
                </div>
            </div>
            <div class="container_tool">
                <div class="sub_tool">
                    <div class="sub_sub_tool">
                        <input id="search_go" type="text" placeholder="Search the site">
                        <input id="search_go" type="submit" value="go">
                    </div>
                </div>
                <div class="sub_menu">
                    <div>Home</div>
                    <div>Promotion</div>
                    <div>Gift Baskets</div>
                    <div>Flower Services</div>
                    <div>About</div>
                </div>
            </div>
        </div>
        <div class="content_left">
            <div class="left1">
                <h3>Why Not Contact US Today!</h3>
            </div>
            <div class="left2">
                <div class="form1">
                    <div>
                        <label>Name:</label> <br>
                        <input type="text">
                    </div>
                    <div>
                        <label>Email:</label><br>
                        <input type="text">
                    </div>
                </div>
                <div class="form2">
                    <div>
                        <label>Telephone:</label><br>
                        <input type="text">
                    </div>
                    <div>
                        <label>Subject:</label> <br>
                        <input type="text">
                    </div>
                </div> 
                <div class="form3">
                    <label>Message:</label><br>
                    <textarea cols="50" rows="5"></textarea> <br>
                    <input type="submit" value="Submit"> 
                    <input type="submit" value="Reset">
                </div>
            </div>
        </div>
        <div class="content_right">
            <div class="sub_container_right">
                <div class="content1">
                    <h3>Discount & Specials</h3>
                </div>
                <div class="content2">
                    <img id="pic1" src="./img/hoa_tay_bac.png" alt="hoa_tay_bac">
                    <figcaption>Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam laboriosam, illum molestias asperiores magni minima est iure doloremque corrupti fuga?</figcaption>
                    <a id="read_more" href="">Read More</a>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>Copyright @ 2017 - All Rights Reserved - Software Engineering Department - Industrial University of Ho Chi Minh City</p>
        </div>
    </div>
</body>
</html>
